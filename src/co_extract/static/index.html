<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Order Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* A white review desk. Left: the document, every extracted value circled and tied by an
     arrow to a callout. Right: the extracted JSON, value and confidence per field.
     A number pin is the shared key between a circle and its JSON line. */
  :root {
    --paper: #ffffff;
    --ink: #17202b;
    --muted: #5d6876;
    --rule: #e2e6eb;
    --wash: #f6f8fa;
    --blue: #1f5fbf;          /* blueprint blue: anything you can click, and the selected field */
    --blue-wash: #eaf1fc;
    --good: #1b7f45; --good-wash: #e7f5ed;
    --warn: #b06a00; --warn-wash: #fdf3e2;
    --bad: #c0352b;  --bad-wash: #fdecea;
    --key: #7a3e9d;           /* JSON keys */
    --str: #0f6a5c;           /* JSON strings */
    --sans: "Public Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 15px/1.5 var(--sans); font-variant-numeric: tabular-nums; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .wrap { max-width: 1440px; margin: 0 auto; padding: 0 24px; }
  header.top { border-bottom: 1px solid var(--rule); }
  header.top .wrap { display: flex; align-items: baseline; gap: 16px; padding-block: 18px; flex-wrap: wrap; }
  header.top h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  header.top p { margin: 0; color: var(--muted); }

  /* ---------- intake ---------- */
  .intake { padding-block: 24px; display: grid; gap: 16px; }
  .sources { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 760px) { .sources { grid-template-columns: 1fr; } }
  .label { font-weight: 600; font-size: 14px; margin-bottom: 6px; display: block; }
  .drop {
    border: 1.5px dashed #c5ccd5; border-radius: 10px; background: var(--wash);
    min-height: 168px; display: grid; place-items: center; text-align: center; padding: 20px;
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over { border-color: var(--blue); background: var(--blue-wash); }
  .drop strong { display: block; font-size: 16px; }
  .drop span { color: var(--muted); font-size: 14px; }
  .file {
    display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 16px; align-items: center;
    border: 1px solid var(--rule); border-radius: 10px; padding: 14px; min-height: 168px;
  }
  .thumb {
    width: 112px; height: 140px; border: 1px solid var(--rule); border-radius: 6px; background: var(--wash);
    display: grid; place-items: center; overflow: hidden; cursor: zoom-in; padding: 0;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .thumb .ext { font-weight: 700; font-size: 18px; color: var(--muted); }
  .file .name { font-weight: 600; word-break: break-all; }
  .file .size { color: var(--muted); font-size: 14px; margin-bottom: 10px; }
  .file .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  textarea {
    width: 100%; min-height: 168px; resize: vertical; border: 1px solid var(--rule); border-radius: 10px;
    background: var(--wash); padding: 12px; font: 13px/1.5 var(--mono);
  }
  textarea:focus { background: var(--paper); }
  .samples { display: flex; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--muted); margin-top: 6px; }
  .go-row { display: flex; gap: 14px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .btn { border: 1px solid var(--rule); background: var(--paper); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-weight: 500; }
  .btn:hover { border-color: #c5ccd5; background: var(--wash); }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 600; padding: 11px 28px; font-size: 16px; }
  .btn.primary:hover { background: #194f9f; }
  .btn.primary:disabled { opacity: .75; cursor: progress; }
  .link { border: 0; background: none; color: var(--blue); padding: 0; cursor: pointer; font-weight: 500; }
  .link:hover { text-decoration: underline; }
  .hint { color: var(--muted); font-size: 14px; }
  .error { border: 1px solid var(--bad); background: var(--bad-wash); color: var(--bad); border-radius: 8px; padding: 12px 14px; white-space: pre-wrap; }

  /* ---------- workspace ---------- */
  .workspace { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 24px; border-top: 1px solid var(--rule); padding-block: 24px 64px; }
  @media (max-width: 1080px) { .workspace { grid-template-columns: minmax(0, 1fr); } }
  .panel {
    position: sticky; top: 16px; align-self: start; height: calc(100vh - 32px); min-height: 480px;
    display: grid; grid-template-rows: auto minmax(0, 1fr); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden;
  }
  @media (max-width: 1080px) { .panel { position: static; height: 78vh; } }
  .panel-bar { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; min-height: 50px; }
  .panel-bar h2 { margin: 0; font-size: 15px; }
  .panel-bar .spacer { flex: 1; }
  .panel-bar .doc-name { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

  /* the original document, as uploaded (the panel and the preview dialog both use it) */
  .doc-body { overflow: auto; background: var(--wash); }
  .doc-body iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--paper); }
  .doc-body .img-wrap { padding: 16px; }
  .doc-body img { display: block; max-width: 100%; margin: 0 auto; box-shadow: 0 1px 3px rgba(23, 32, 43, .12); background: var(--paper); cursor: zoom-in; }
  .doc-body img.zoomed { max-width: none; cursor: zoom-out; }
  .doc-body pre { margin: 16px; padding: 14px; background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; font: 12.5px/1.6 var(--mono); white-space: pre-wrap; }
  .doc-body .note { margin: 16px; color: var(--muted); }

  /* JSON */
  .json-body { overflow: auto; background: var(--paper); padding: 12px 0; }
  .json { font: 13px/1.75 var(--mono); min-width: max-content; }
  .jl { padding: 0 16px; }
  .jl .code { white-space: pre; }
  .j-key { color: var(--key); }
  .j-str { color: var(--str); }
  .j-num { color: var(--ink); }
  .j-null, .j-punc { color: var(--muted); }
  .j-str.j-warn { color: var(--bad); font-weight: 600; }
  .j-conf { font-weight: 600; border-radius: 4px; padding: 0 4px; }
  .j-conf.good { color: var(--good); background: var(--good-wash); }
  .j-conf.warn { color: var(--warn); background: var(--warn-wash); }
  .j-conf.bad { color: var(--bad); background: var(--bad-wash); }

  /* preview dialog */
  dialog { border: 0; border-radius: 12px; padding: 0; width: min(960px, 94vw); height: min(88vh, 1100px); box-shadow: 0 20px 60px rgba(23, 32, 43, .25); }
  dialog::backdrop { background: rgba(23, 32, 43, .45); }
  .dlg { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
  .dlg-bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
  .dlg-bar span { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dlg-bar .btn { margin-left: auto; }


  /* whole-document warnings */
  .banner { grid-column: 1 / -1; border-radius: 10px; padding: 14px 16px; border: 1px solid; display: grid; gap: 4px; }
  .banner.bad { background: var(--bad-wash); border-color: var(--bad); color: var(--bad); }
  .banner.warn { background: var(--warn-wash); border-color: var(--warn); color: var(--warn); }
  .banner b { font-size: 16px; }
  .banner span { color: var(--ink); }

  /* progress timeline */
  .timeline { list-style: none; margin: 0 auto; padding: 16px 18px; border: 1px solid var(--rule); border-radius: 10px; width: 100%; max-width: 560px; display: grid; gap: 0; }
  .timeline li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 14px; }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline li:not(:last-child)::after { content: ""; position: absolute; left: 12px; top: 26px; bottom: 2px; width: 2px; background: var(--rule); }
  .timeline li.done:not(:last-child)::after { background: var(--good); }
  .timeline .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--rule); background: var(--paper); font-size: 14px; font-weight: 700; color: #fff; }
  .timeline li.done .dot { background: var(--good); border-color: var(--good); }
  .timeline li.active .dot { border-color: var(--blue); border-right-color: transparent; animation: spin .8s linear infinite; }
  .timeline li.failed .dot { background: var(--bad); border-color: var(--bad); }
  .timeline .what { padding-top: 2px; }
  .timeline .what b { font-weight: 500; color: var(--muted); }
  .timeline li.active .what b, .timeline li.done .what b { color: var(--ink); }
  .timeline li.active .what b { font-weight: 600; }
  .timeline .what small { display: block; color: var(--muted); font-size: 13px; }
  /* live detail under the model step: always something moving, and real numbers when the model streams */
  .live { margin-top: 6px; display: grid; gap: 5px; }
  .live .status { font-size: 13px; color: var(--ink); }
  .live .status em { font-style: normal; color: var(--muted); }
  .track { height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; position: relative; }
  .track .fill { position: absolute; inset: 0 auto 0 0; background: var(--blue); border-radius: 3px; animation: grow .45s ease-out forwards; }
  .track.indeterminate .fill { width: 35%; animation: slide 1.4s ease-in-out infinite; }
  @keyframes grow { from { width: var(--from); } to { width: var(--to); } }
  @keyframes slide { from { left: -35%; } to { left: 100%; } }

  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner, .timeline li.active .dot { animation-duration: 2.5s; }
    .track.indeterminate .fill { animation: none; left: 0; width: 100%; opacity: .35; }
    .track .fill { animation: none; width: var(--to); }
    * { transition: none !important; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>Change order review</h1>
    <p>Upload a change order to get its fields as JSON, each with a confidence score, and see where each one came from.</p>
  </div>
</header>

<main>
  <section class="wrap intake" aria-label="Document">
    <div class="sources">
      <div>
        <span class="label" id="upload-label">Upload a file</span>
        <div id="drop" class="drop" role="button" tabindex="0" aria-labelledby="upload-label">
          <div>
            <strong>Drop a file here, or click to browse</strong>
            <span>PDF, photo or scan (JPG, PNG, TIFF, WebP), email (.eml) or .txt</span>
          </div>
        </div>
        <div id="fileCard" class="file" hidden>
          <button id="thumb" class="thumb" type="button" aria-label="Preview the file"></button>
          <div>
            <div class="name" id="fileName"></div>
            <div class="size" id="fileSize"></div>
            <div class="actions">
              <button class="btn" id="previewBtn" type="button">Preview</button>
              <button class="btn" id="replaceBtn" type="button">Replace</button>
              <button class="btn" id="removeBtn" type="button">Remove</button>
            </div>
          </div>
        </div>
        <input id="file" type="file" accept=".pdf,.txt,.eml,.png,.jpg,.jpeg,.tif,.tiff,.webp,.bmp" hidden>
      </div>
      <div>
        <label class="label" for="text">Or paste the text</label>
        <textarea id="text" placeholder="CHANGE ORDER No. …"></textarea>
        <div class="samples" id="samples"></div>
      </div>
    </div>
    <div class="go-row">
      <button id="go" class="btn primary" type="button">Extract</button>
    </div>
    <ol id="timeline" class="timeline" hidden aria-live="polite" aria-label="Progress"></ol>
    <div id="error" class="error" role="alert" hidden></div>
  </section>

  <section id="workspace" class="wrap workspace" hidden aria-label="Results">
    <div id="banner" class="banner" role="alert" hidden></div>
    <div class="panel">
      <div class="panel-bar">
        <h2>Document</h2>
        <span class="doc-name" id="docName"></span>
      </div>
      <div class="doc-body" id="docBody"></div>
    </div>
    <div class="panel">
      <div class="panel-bar">
        <h2>Extracted JSON</h2>
        <span class="spacer"></span>
        <button class="btn" id="copyJson" type="button">Copy</button>
        <button class="btn" id="dlJson" type="button">Download</button>
      </div>
      <div class="json-body" id="jsonBody"></div>
    </div>
  </section>
</main>

<dialog id="dialog" aria-label="File preview">
  <div class="dlg">
    <div class="dlg-bar"><strong>Preview</strong><span id="dlgName"></span><button class="btn" id="dlgClose" type="button">Close</button></div>
    <div class="dlg-body doc-body" id="dlgBody"></div>
  </div>
</dialog>

<script>
const THRESHOLD = 0.7;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

const IMAGE_EXT = ["png", "jpg", "jpeg", "tif", "tiff", "webp", "bmp"];
const BROWSER_IMAGES = ["png", "jpg", "jpeg", "webp", "bmp"];   // TIFF doesn't display in most browsers
const state = { file: null, url: null, kind: null, ext: "", text: "", sample: null, result: null };

const tone = (c) => c >= 0.85 ? "good" : c >= THRESHOLD ? "warn" : "bad";
const sizeOf = (n) => n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(0)} KB` : `${(n / 1048576).toFixed(1)} MB`;

// ---------- choosing a document ----------
function kindOf(name) {
  const ext = (name.split(".").pop() || "").toLowerCase();
  return { ext, kind: ext === "pdf" ? "pdf" : IMAGE_EXT.includes(ext) ? "image" : "text" };
}
async function setFile(f) {
  if (state.url) URL.revokeObjectURL(state.url);
  state.file = f; state.url = null; state.text = ""; state.sample = null;
  if (!f) { $("fileCard").hidden = true; $("drop").hidden = false; return; }
  Object.assign(state, kindOf(f.name));
  state.url = URL.createObjectURL(f);
  if (state.kind === "text") state.text = await f.text();
  $("text").value = "";
  $("fileName").textContent = f.name;
  $("fileSize").textContent = `${state.ext.toUpperCase()} file, ${sizeOf(f.size)}`;
  $("thumb").innerHTML = state.kind === "image" && BROWSER_IMAGES.includes(state.ext)
    ? `<img src="${state.url}" alt="">` : `<span class="ext">${esc(state.ext.toUpperCase())}</span>`;
  $("drop").hidden = true; $("fileCard").hidden = false;
}
const pick = () => $("file").click();
$("drop").onclick = pick;
$("drop").onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } };
$("replaceBtn").onclick = pick;
$("removeBtn").onclick = () => { setFile(null); $("file").value = ""; };
$("file").onchange = (e) => setFile(e.target.files[0] || null);
["dragenter", "dragover"].forEach((t) => $("drop").addEventListener(t, (e) => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach((t) => $("drop").addEventListener(t, (e) => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", (e) => { if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]); });
$("text").oninput = () => { state.sample = null; if ($("text").value && state.file) { setFile(null); $("file").value = ""; } };

// ---------- the original document ----------
function originalHTML() {
  if (state.file && state.kind === "pdf") return `<iframe title="Original document" src="${state.url}#view=FitH"></iframe>`;
  if (state.file && state.kind === "image") return BROWSER_IMAGES.includes(state.ext)
    ? `<div class="img-wrap"><img src="${state.url}" alt="Uploaded document" title="Click to zoom"></div>`
    : `<p class="note">Your browser can't display ${esc(state.ext.toUpperCase())} files, but the extraction read it.</p>`;
  return `<pre>${esc(state.text || $("text").value)}</pre>`;
}
function showOriginal(body) {
  body.innerHTML = originalHTML();
  body.querySelectorAll("img").forEach((img) => img.onclick = () => img.classList.toggle("zoomed"));
}
function openPreview() {
  $("dlgName").textContent = state.file ? state.file.name : "Pasted text";
  showOriginal($("dlgBody"));
  $("dialog").showModal();
}
$("previewBtn").onclick = openPreview;
$("thumb").onclick = openPreview;
$("dlgClose").onclick = () => $("dialog").close();
$("dialog").addEventListener("click", (e) => { if (e.target === $("dialog")) $("dialog").close(); });
function renderDocument() {
  $("docName").textContent = state.file ? state.file.name : "Pasted text";
  showOriginal($("docBody"));
}

// ---------- the extracted JSON ----------
// Exactly what the user asked for: every field's value and confidence, plus the document's.
// Problems with the document as a whole: the issues that aren't tied to any one field.
const DOC_WARNINGS = {
  not_a_change_order: () => "This document is not a change order.",
  multiple_change_orders: (i) => i.message.replace(/\.$/, "") + ".",
};
const docWarnings = (r) => r.issues.filter((i) => DOC_WARNINGS[i.code]).map((i) => ({ code: i.code, text: DOC_WARNINGS[i.code](i) }));
function simplified(r) {
  const round = (c) => Math.round(c * 100) / 100;   // two decimals, as displayed
  const out = { document_confidence: round(r.document_confidence) };
  const warnings = docWarnings(r).map((w) => w.text);
  if (warnings.length) out.warnings = warnings;
  out.fields = {};
  for (const [name, f] of Object.entries(r.fields)) out.fields[name] = { value: f.value, confidence: round(f.confidence) };
  return out;
}
function jsonValue(v, indent) {
  if (v === null) return '<span class="j-null">null</span>';
  if (typeof v === "string") return `<span class="j-str">${esc(JSON.stringify(v))}</span>`;
  if (typeof v === "number" || typeof v === "boolean") return `<span class="j-num">${v}</span>`;
  const pad = " ".repeat(indent + 2), end = " ".repeat(indent);
  if (Array.isArray(v)) {
    if (!v.length) return '<span class="j-punc">[]</span>';
    return '<span class="j-punc">[</span>\n' + v.map((x) => pad + jsonValue(x, indent + 2)).join('<span class="j-punc">,</span>\n') + `\n${end}<span class="j-punc">]</span>`;
  }
  const keys = Object.keys(v);
  return '<span class="j-punc">{</span>\n' + keys.map((k) => `${pad}<span class="j-key">${esc(JSON.stringify(k))}</span><span class="j-punc">: </span>${jsonValue(v[k], indent + 2)}`).join('<span class="j-punc">,</span>\n') + `\n${end}<span class="j-punc">}</span>`;
}
function renderJSON() {
  const data = simplified(state.result);
  const line = (code) => `<div class="jl"><span class="code">${code}</span></div>`;
  const conf = (c) => `<span class="j-conf ${tone(c)}">${c}</span>`;
  const names = Object.keys(data.fields);
  let html = line('<span class="j-punc">{</span>');
  html += line(`  <span class="j-key">"document_confidence"</span><span class="j-punc">: </span>${conf(data.document_confidence)}<span class="j-punc">,</span>`);
  if (data.warnings) {
    html += line('  <span class="j-key">"warnings"</span><span class="j-punc">: [</span>');
    data.warnings.forEach((w, i) => html += line(`    <span class="j-str j-warn">${esc(JSON.stringify(w))}</span>${i < data.warnings.length - 1 ? '<span class="j-punc">,</span>' : ""}`));
    html += line('  <span class="j-punc">],</span>');
  }
  html += line('  <span class="j-key">"fields"</span><span class="j-punc">: {</span>');
  names.forEach((name, i) => {
    const f = data.fields[name], comma = i < names.length - 1 ? '<span class="j-punc">,</span>' : "";
    if (name === "line_items") {
      // Line items are a list: show it expanded so each row reads on its own line.
      const body = jsonValue(f.value, 6).split("\n");
      const head = `    <span class="j-key">"line_items"</span><span class="j-punc">: { </span><span class="j-key">"value"</span><span class="j-punc">: </span>`;
      const tail = `<span class="j-punc">, </span><span class="j-key">"confidence"</span><span class="j-punc">: </span>${conf(f.confidence)}<span class="j-punc"> }</span>${comma}`;
      if (body.length === 1) { html += line(head + body[0] + tail); return; }
      html += line(head + body[0]);
      body.slice(1, -1).forEach((b) => html += line(b));
      html += line(body[body.length - 1] + tail);
      return;
    }
    html += line(`    <span class="j-key">${esc(JSON.stringify(name))}</span><span class="j-punc">: { </span><span class="j-key">"value"</span><span class="j-punc">: </span>${jsonValue(f.value, 0)}<span class="j-punc">, </span><span class="j-key">"confidence"</span><span class="j-punc">: </span>${conf(f.confidence)}<span class="j-punc"> }</span>${comma}`);
  });
  html += line('  <span class="j-punc">}</span>') + line('<span class="j-punc">}</span>');
  $("jsonBody").innerHTML = `<div class="json">${html}</div>`;
}
const jsonText = () => JSON.stringify(simplified(state.result), null, 2);
$("copyJson").onclick = async () => {
  try { await navigator.clipboard.writeText(jsonText()); $("copyJson").textContent = "Copied"; }
  catch { $("copyJson").textContent = "Copy failed"; }
  setTimeout(() => $("copyJson").textContent = "Copy", 1500);
};
$("dlJson").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([jsonText()], { type: "application/json" }));
  a.download = (state.result.source || "result").replace(/\.[^.]+$/, "") + ".json";
  a.click();
};

// ---------- samples ----------
async function loadSamples() {
  const names = await (await fetch("/api/samples")).json();
  if (!names.length) return;
  $("samples").innerHTML = "<span>Try a sample (recorded result, no model call):</span>" + names.map((n) => `<button class="link" type="button" data-s="${esc(n)}">${esc(n.replace(/_/g, " "))}</button>`).join("");
  $("samples").querySelectorAll("button").forEach((b) => b.onclick = async () => {
    await setFile(null); $("file").value = "";
    $("text").value = await (await fetch("/api/samples/" + encodeURIComponent(b.dataset.s))).text();
    state.sample = b.dataset.s;
  });
}

// ---------- progress timeline ----------
// Driven by the server's real progress events, so each tick means that step actually finished.
const STEPS = [
  { id: "read", label: "Reading the document" },
  { id: "extract", label: "Reading the fields with the AI model", note: "The longest step, usually under a minute." },
  { id: "validate", label: "Checking the math", note: "Line items, subtotal, total and the contract sum." },
  { id: "repair", label: "Re-reading to fix what didn't add up", optional: true },
  { id: "score", label: "Scoring confidence for each field" },
];
const progress = { current: null, seen: new Set(), info: {}, bar: {}, failed: false };
// The validator's check codes, in words (see validate.py).
const CHECKS = {
  unparseable: "a value couldn't be read",
  missing_critical: "the change order number is missing",
  line_item_math: "a line's quantity × price doesn't match its amount",
  line_items_vs_subtotal: "the line items don't add up to the subtotal",
  subtotal_to_total: "subtotal + markup + tax doesn't equal the total",
  contract_sum_rollforward: "the contract sums don't add up",
  date_order: "the dates are out of order",
  implausible_value: "a value looks implausible",
  credit_sign: "a credit has the wrong sign",
  not_a_change_order: "it doesn't look like a change order",
  multiple_change_orders: "it holds more than one change order",
};
function renderTimeline() {
  const order = STEPS.map((s) => s.id);
  const at = order.indexOf(progress.current);
  $("timeline").innerHTML = STEPS.filter((s) => !s.optional || progress.seen.has(s.id)).map((s) => {
    const i = order.indexOf(s.id);
    const status = progress.failed && s.id === progress.current ? "failed" : i < at ? "done" : i === at ? "active" : "pending";
    let note = s.note || "";
    if (s.id === "repair" && progress.info.repair) {
      const checks = [...new Set(progress.info.repair.checks)].map((c) => CHECKS[c] || c.replace(/_/g, " "));
      note = `On the first read ${checks.join("; ")}. The model is reading it again with those checks in mind.`;
    }
    if (s.id === "read" && progress.info.read?.ocr)
      note = status === "done" ? "Scan read with Docling (IBM watsonx)." : "Reading the scan with Docling (IBM watsonx)…";
    if (status === "done" && s.id !== "repair" && !(s.id === "read" && progress.info.read?.ocr)) note = "";
    const icon = status === "done" ? "✓" : status === "failed" ? "✕" : "";
    const live = status === "active" && (s.id === "extract" || s.id === "repair") ? liveDetail(s.id) : "";
    return `<li class="${status}"><span class="dot" aria-hidden="true">${icon}</span><span class="what"><b>${s.label}</b>${note ? `<small>${esc(note)}</small>` : ""}${live}</span></li>`;
  }).join("");
}
// What the model is doing right now, from the streamed progress events. Providers that
// don't stream never send them, and the sliding bar alone shows the request is alive.
function liveDetail(stepId) {
  const info = progress.info[stepId] || {};
  if (info.phase === "writing") {
    const to = Math.round(100 * info.found / info.total), from = progress.bar[stepId] ?? 0;
    progress.bar[stepId] = to;
    return `<span class="live"><span class="status">Writing the fields <em>· ${info.found} of ${info.total}</em></span>
      <span class="track" role="progressbar" aria-valuemin="0" aria-valuemax="${info.total}" aria-valuenow="${info.found}"><span class="fill" style="--from:${from}%;--to:${to}%"></span></span></span>`;
  }
  const text = info.phase === "thinking"
    ? `Thinking about the document <em>· ${info.words.toLocaleString()} words so far</em>`
    : "Waiting for the model to start…";
  return `<span class="live"><span class="status">${text}</span><span class="track indeterminate" aria-hidden="true"><span class="fill"></span></span></span>`;
}
function onStep(ev) {
  progress.current = ev.step; progress.seen.add(ev.step);
  // Repeated events for one step (live model progress) update it rather than replace it.
  progress.info[ev.step] = { ...progress.info[ev.step], ...ev };
  renderTimeline();
}

// Read the newline-delimited JSON progress stream; resolves with the final result.
async function extractWithProgress(fd) {
  const resp = await fetch("/api/extract/stream", { method: "POST", body: fd });
  if (!resp.ok) {
    const body = await resp.json().catch(() => ({ detail: resp.statusText }));
    throw new Error(typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail));
  }
  const reader = resp.body.getReader(), decoder = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let nl;
    while ((nl = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, nl).trim(); buf = buf.slice(nl + 1);
      if (!line) continue;
      const ev = JSON.parse(line);
      if (ev.step) onStep(ev);
      else if (ev.error) throw new Error(ev.error);
      else if (ev.result) return ev.result;
    }
  }
  throw new Error("The connection closed before the result arrived. Try again.");
}

// ---------- extraction ----------
$("go").onclick = async () => {
  const fd = new FormData();
  if (state.file) fd.append("file", state.file);
  else {
    if (!$("text").value.trim()) return showError("Upload a file or paste the change order text first.");
    fd.append("text", $("text").value);
    // A sample replays its recorded result, so trying the app never spends API quota.
    if (state.sample) { fd.append("name", state.sample); fd.append("provider", "demo"); }
    state.kind = "text"; state.text = $("text").value;
  }
  $("error").hidden = true;
  const btn = $("go");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Extracting';
  Object.assign(progress, { current: "read", seen: new Set(["read"]), info: {}, bar: {}, failed: false });
  renderTimeline();
  $("timeline").hidden = false;
  try {
    const body = await extractWithProgress(fd);
    $("timeline").hidden = true;
    state.result = body;
    $("workspace").hidden = false;
    renderBanner(); renderDocument(); renderJSON();
    $("workspace").scrollIntoView({ behavior: "smooth" });
  } catch (err) {
    progress.failed = true; renderTimeline();
    showError("Extraction failed: " + err.message);
  } finally {
    btn.disabled = false; btn.textContent = "Extract";
  }
};
function renderBanner() {
  const ws = docWarnings(state.result), banner = $("banner");
  const notCO = ws.some((w) => w.code === "not_a_change_order");
  banner.hidden = !ws.length;
  if (!ws.length) return;
  banner.className = "banner " + (notCO ? "bad" : "warn");
  banner.innerHTML = notCO
    ? `<b>This doesn't look like a change order.</b><span>The model still filed what it found into change-order fields, so treat these values as unreliable. Every confidence is set to 0 and the document needs a person to review it.</span>`
    : ws.map((w) => `<b>${esc(w.text)}</b>`).join("") + "<span>Check the document before using these values.</span>";
}
function showError(msg) { $("error").textContent = msg; $("error").hidden = false; }

loadSamples();
</script>
